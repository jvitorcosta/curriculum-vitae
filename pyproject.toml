[project]
name = "curriculum-vitae"
version = "0.1.0"
description = "Vitor Pinheiro's resume, applications and answer bank"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "markdown>=3.11.2",
]

[project.scripts]
cv = "cv.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
