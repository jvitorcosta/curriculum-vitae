# Example config for `cv ask`. Copy to private/salary/ask.toml and tune it there.
# The ask is low + position * (high - low), where
#   position = w_company * company_score + w_role * role_score, then pulled toward the middle:
#   position = position + nudge * (0.5 - position)
# Scores are 0-1 weighted means of the known signals; unknown signals are left out.
# `cv ask calibrate` suggests w_company, w_role and nudge from your corrections. It never edits this file.

w_company = 0.4
w_role = 0.6    # w_company + w_role must be 1
nudge = 0.1     # get-hired nudge, 0 = none, 1 = always the band's middle

# Monthly bands per company type and contract: [low, high], BRL for clt/pj, USD for contractor.
# Used unless the observation log has at least 3 market rows for the same type and contract.
[bands.br-big]
clt = [18000, 23000]

[bands.br-startup]
clt = [15000, 20000]
pj = [15000, 20000]

[bands.br-consultancy]
clt = [14000, 18000]
pj = [14000, 18000]

[bands.br-regional]
clt = [14000, 16000]

[bands.offshore-usd]
contractor = [4000, 6000]

[bands.foreign-product]
contractor = [5000, 7000]

# The ask never goes above these (monthly, same currency as the band).
[ceilings]
clt = 30000
pj = 30000
contractor = 9000

# Signal maps. `steps` = [[at least, value], ...]: the value of the last threshold the signal reaches.
# `values` = a value per label. `weight` = the signal's weight in its score's mean.

# Company signals
[signals.size]          # employees
weight = 1
steps = [[0, 0.0], [100, 0.1], [500, 0.2], [5000, 0.8], [10000, 1.0]]

[signals.rating]        # Glassdoor, 0-5
weight = 1
steps = [[0, 0.0], [3.5, 0.2], [4.0, 0.6], [4.3, 1.0]]

[signals.reach]
weight = 1
values = { local = 0.0, national = 0.2, multinational = 0.8, usd-payer = 1.0 }

[signals.maturity]
weight = 1
values = { early = 0.0, growth = 0.3, established = 1.0 }

# Role signals
[signals.years]         # years of experience the posting asks for
weight = 1
steps = [[0, 0.0], [1, 0.2], [3, 0.6], [5, 0.9]]

[signals.level]         # title level; mid ("pleno") pulls the ask down
weight = 2
values = { junior = 0.0, mid = 0.0, senior = 0.8, staff = 0.9, lead = 1.0 }

[signals.org]           # embedded = sitting in a business team
weight = 1
values = { embedded = 0.0, engineering = 0.7 }

[signals.demands]       # flags add up, capped at 1; none given = unknown
weight = 1
values = { on-call = 0.6, client-facing = 0.5, leads-people = 0.7, travel = 0.4 }
